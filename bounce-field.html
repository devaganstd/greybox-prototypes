<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #dfe6f3; font: 14px system-ui, sans-serif; overflow: hidden; }

  .corner { position: absolute; top: 6px; width: 38px; height: 38px; border: 1px solid #3a4560; background: #111827; color: #dfe6f3; border-radius: 8px; font-size: 18px; cursor: pointer; }
  .ov { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(5,7,13,.9); text-align: center; padding: 16px; box-sizing: border-box; }

  #panel.on { display: block; }

  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; gap: 8px; }
  #panel input { width: 72px; background: #0b0f1a; color: #fff; border: 1px solid #3a4560; border-radius: 4px; padding: 2px 4px; }
  #panel pre { white-space: pre-wrap; color: #aab4c8; margin: 0; }

</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button class="corner" id="btnMenu" style="left:6px" title="Menu">&#8801;</button>

  <div class="ov on" id="menu">
    <h2>BOUNCE FIELD</h2>

  </div>

</div>
<div id="panel">
  <button id="btnClose" style="float:right">Close (T)</button>
  <h3>Tuning (CFG, berlaku langsung)</h3>
  <div id="knobs"></div>
  <button id="btnRestart">Restart run</button>
  <h3>Telemetry</h3>
  <pre id="tele"></pre>
  <button id="btnCopy">Copy JSON</button>
  <button id="btnClear">Clear log</button>
</div>
<script>
'use strict';
// ===== Tuning: every knob lives here (also editable live in the panel, key T) =====
const CFG = {
  launcherDeg: 60,      // fixed launch angle from horizontal (60 = up-right, 120 = up-left). Endless uses this; stages may override
  speed: 720,           // ball speed, logical px/s (arena is 336 x 480)
  launchGap: 0.06,      // seconds between balls in a volley
  ballR: 4,
  previewBounces: 2,    // Endless preview length (bounces counted from launcher; wall, mirror and brick all count)
  wallAdd: 1,           // Ricochet: multiplier added per wall/ceiling bounce
  mirrorAdd: 2,         // Ricochet: multiplier added per mirror bounce
  brickAdd: 0,          // Ricochet: multiplier added per brick bounce (concept §3.1 says 0)
  maxMult: 12,
  mirrorLen: 1.4,       // mirror length in cells
  startBalls: 1,        // Endless starting balls
  pickupPerRow: 1,      // +1 ball rings spawned per new row
  freeBallsPerTurn: 1,  // Endless: balls added every turn without a pickup (0 = pure Ballz rule; see README findings)
  hpPerTurn: 4,         // Endless new-row HP (concept said 2.5; bot sweep favours 4 with freeBallsPerTurn 1) = round(turn * hpPerTurn * U[1-j, 1+j])
  hpJitter: 0.3,
  toughChance: 0.15,
  toughMult: 2,
  bricksMin: 4,         // bricks per new row (of 7 columns)
  bricksMax: 6,
  safetyBounces: 60,    // bounces without a brick hit before ball drops straight down
  fastForward: 4,       // speed multiplier while holding/tapping during a volley
  seed: 12345,          // Endless RNG seed (same seed + same mirror moves = same run)
};

const COLS = 7, ROWS = 10, CELL = 48, AW = COLS * CELL, AH = ROWS * CELL;
const LW = 360, LH = 640, AX = 12, AY = 64;     // logical canvas and arena offset
const TICK = 1 / 120;                           // fixed sim step -> deterministic volleys
const FIRE = { x: 236, y: AY + AH + 24, w: 112, h: 52 };

// ===== FTUE stages (concept §7, stages 1-5). Grid: '.' empty, 1-9/a-z = HP (base 36), '+' = +1 ball ring =====
const STAGES = [
  { hint: 'Tap FIRE', balls: 3, turns: 2, preview: 99, mirror: null,
    grid: ['.......', '.....1.', '.......', '.......', '......1', '.......', '.......', '....1..'] },
  { hint: 'Tap mirror = rotate', balls: 3, turns: 3, preview: 99, mirror: { c: 4, r: 8, a: 75 },
    grid: ['1......', '1......', '.1.....'] },
  { hint: 'Drag mirror = move', balls: 3, turns: 3, preview: 99, mirror: { c: 5, r: 8, a: 90 },
    grid: ['.......', '.......', '.......', '11.....', '1......'] },
  { hint: 'Bounces = damage', balls: 2, turns: 3, preview: 3, mirror: { c: 3, r: 7, a: 0 },
    grid: ['.......', '.......', '8......'] },
  { hint: 'Bricks fall. Clear them!', balls: 3, turns: 5, preview: 3, mirror: { c: 3, r: 7, a: 0 }, descend: true,
    grid: ['.......', '.......', '.......', '2.3.2.3', '.3.4.3.', '2..2..2'] },
];

// ===== RNG =====
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ===== World helpers =====
const brickAt = (st, c, r) => st.bricks.find(b => b.c === c && b.r === r && b.hp > 0);
const mirrorKey = st => st.mirror ? `${st.mirror.c},${st.mirror.r},${st.mirror.a}` : '';
const launcherDeg = st => st.mode === 'endless' ? CFG.launcherDeg : (st.def.launcher ?? CFG.launcherDeg);
const previewDepth = st => st.mode === 'endless' ? CFG.previewBounces : st.def.preview;

function mirrorSeg(m) {
  const cx = m.c * CELL + CELL / 2, cy = m.r * CELL + CELL / 2, h = CFG.mirrorLen * CELL / 2, a = m.a * Math.PI / 180;
  const ux = Math.cos(a), uy = -Math.sin(a);
  return { cx, cy, px: cx - ux * h, py: cy - uy * h, qx: cx + ux * h, qy: cy + uy * h };
}

// Earliest hit along a ray within maxT. Ball = point of radius R vs walls/bricks (Minkowski), mirror = thin two-sided segment.
function cast(st, x, y, dx, dy, maxT, falling) {
  const R = CFG.ballR, EPS = 1e-6;
  let best = null, bt = maxT;
  const take = (t, o) => { if (t >= EPS && t < bt) { bt = t; best = Object.assign({ t }, o); } };
  if (dx < 0) take((R - x) / dx, { kind: 'wall', nx: 1, ny: 0 });
  if (dx > 0) take((AW - R - x) / dx, { kind: 'wall', nx: -1, ny: 0 });
  if (dy < 0) take((R - y) / dy, { kind: 'wall', nx: 0, ny: 1 });
  if (dy > 0) take((AH - y) / dy, { kind: 'floor' });
  if (falling) return best;
  for (const b of st.bricks) {
    if (b.hp <= 0) continue;
    const x0 = b.c * CELL + 1 - R, x1 = (b.c + 1) * CELL - 1 + R, y0 = b.r * CELL + 1 - R, y1 = (b.r + 1) * CELL - 1 + R;
    let tx0, tx1, ty0, ty1;
    if (dx !== 0) { const a = (x0 - x) / dx, c = (x1 - x) / dx; tx0 = Math.min(a, c); tx1 = Math.max(a, c); }
    else { if (x < x0 || x > x1) continue; tx0 = -Infinity; tx1 = Infinity; }
    if (dy !== 0) { const a = (y0 - y) / dy, c = (y1 - y) / dy; ty0 = Math.min(a, c); ty1 = Math.max(a, c); }
    else { if (y < y0 || y > y1) continue; ty0 = -Infinity; ty1 = Infinity; }
    const tin = Math.max(tx0, ty0), tout = Math.min(tx1, ty1);
    if (tin > tout) continue;
    take(tin, tx0 > ty0 ? { kind: 'brick', brick: b, nx: -Math.sign(dx), ny: 0 } : { kind: 'brick', brick: b, nx: 0, ny: -Math.sign(dy) });
  }
  if (st.mirror) {
    const s = mirrorSeg(st.mirror), ex = s.qx - s.px, ey = s.qy - s.py, wx = s.px - x, wy = s.py - y;
    const det = ex * dy - dx * ey;
    if (Math.abs(det) > 1e-9) {
      const t = (ex * wy - wx * ey) / det, u = (dx * wy - dy * wx) / det;
      if (u >= 0 && u <= 1) {
        const len = Math.hypot(ex, ey); let nx = -ey / len, ny = ex / len;
        if (nx * dx + ny * dy > 0) { nx = -nx; ny = -ny; }
        take(t, { kind: 'mirror', nx, ny });
      }
    }
  }
  return best;
}

function reflect(b, h) {
  const d = b.dx * h.nx + b.dy * h.ny;
  b.dx -= 2 * d * h.nx; b.dy -= 2 * d * h.ny;
  const l = Math.hypot(b.dx, b.dy); b.dx /= l; b.dy /= l;
  b.x += h.nx * 0.01; b.y += h.ny * 0.01;
}

function launchBall(st) {
  const a = launcherDeg(st) * Math.PI / 180;
  return { x: AW / 2, y: AH - CFG.ballR - 0.5, dx: Math.cos(a), dy: -Math.sin(a), m: 1, nb: 0, done: false, falling: false };
}

// Ricochet rule (lock K2): wall/ceiling +wallAdd, mirror +mirrorAdd, brick takes damage = current multiplier.
function applyBounce(st, b, h, fx) {
  const T = st.tele;
  if (h.kind === 'brick') {
    const dmg = b.m;
    h.brick.hp -= dmg; b.nb = 0;
    T.hits++; T.multSum += dmg;
    if (st.v) st.v.hits++;
    if (fx) fx(b.x, b.y, dmg, h.brick.hp <= 0);
    b.m = Math.min(CFG.maxMult, b.m + CFG.brickAdd);
  } else {
    b.m = Math.min(CFG.maxMult, b.m + (h.kind === 'mirror' ? CFG.mirrorAdd : CFG.wallAdd));
    b.nb++;
  }
  T.maxM = Math.max(T.maxM, b.m);
  if (st.v) st.v.maxM = Math.max(st.v.maxM, b.m);
  if (b.nb > CFG.safetyBounces) { b.falling = true; b.dx = 0; b.dy = 1; }
}

function segPointDist(x0, y0, x1, y1, px, py) {
  const ex = x1 - x0, ey = y1 - y0, l2 = ex * ex + ey * ey;
  const t = l2 ? Math.max(0, Math.min(1, ((px - x0) * ex + (py - y0) * ey) / l2)) : 0;
  return Math.hypot(x0 + ex * t - px, y0 + ey * t - py);
}

function moveBall(st, b, dist, fx) {
  for (let i = 0; i < 16 && dist > 0; i++) {
    const h = cast(st, b.x, b.y, b.dx, b.dy, dist, b.falling);
    const t = h ? h.t : dist, nx = b.x + b.dx * t, ny = b.y + b.dy * t;
    for (const p of st.pickups) {
      if (!p.taken && segPointDist(b.x, b.y, nx, ny, p.c * CELL + CELL / 2, p.r * CELL + CELL / 2) < 12) { p.taken = true; st.v.gained++; }
    }
    b.x = nx; b.y = ny; dist -= t;
    if (!h) return;
    if (h.kind === 'floor') { b.done = true; return; }
    reflect(b, h);
    applyBounce(st, b, h, fx);
  }
}

// Preview: one ball, bricks static (they never break in preview, like Ballz' aim line).
function previewPath(st, depth) {
  const b = launchBall(st), pts = [];
  while (pts.length < Math.min(depth, 60)) {
    const h = cast(st, b.x, b.y, b.dx, b.dy, 1e9, false);
    b.x += b.dx * h.t; b.y += b.dy * h.t;
    if (h.kind === 'floor') { pts.push({ x: b.x, y: b.y, kind: 'floor' }); break; }
    reflect(b, h);
    if (h.kind === 'brick') { pts.push({ x: b.x, y: b.y, kind: 'brick', m: b.m, brick: h.brick }); b.m = Math.min(CFG.maxMult, b.m + CFG.brickAdd); }
    else { b.m = Math.min(CFG.maxMult, b.m + (h.kind === 'mirror' ? CFG.mirrorAdd : CFG.wallAdd)); pts.push({ x: b.x, y: b.y, kind: h.kind, m: b.m }); }
  }
  return pts;
}

// ===== Run / turn logic =====
function newRun(mode, idx) {
  const st = { mode, idx, bricks: [], pickups: [], mirror: null, turn: 0, phase: 'aim', v: null, fast: false,
    rng: mulberry32(CFG.seed), tele: { t0: performance.now(), turns: 0, mirrorTurns: 0, changed: 0, hits: 0, multSum: 0, maxM: 1 } };
  if (mode === 'stage') {
    const d = st.def = STAGES[idx];
    st.balls = d.balls; st.mirror = d.mirror && { ...d.mirror };
    d.grid.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === '+') st.pickups.push({ c, r });
      else if (ch !== '.') { const hp = parseInt(ch, 36); st.bricks.push({ c, r, hp, max: hp, tough: false }); }
    }));
  } else {
    st.balls = CFG.startBalls; st.mirror = { c: 3, r: 7, a: 0 };
    spawnRow(st, 1);
  }
  st.aimStart = mirrorKey(st);
  return st;
}

function spawnRow(st, t) {
  const rng = st.rng, cols = [...Array(COLS).keys()];
  for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  const n = CFG.bricksMin + Math.floor(rng() * (CFG.bricksMax - CFG.bricksMin + 1));
  cols.slice(0, n).forEach(c => {
    let hp = Math.max(1, Math.round(t * CFG.hpPerTurn * (1 - CFG.hpJitter + 2 * CFG.hpJitter * rng())));
    const tough = rng() < CFG.toughChance; if (tough) hp = Math.round(hp * CFG.toughMult);
    st.bricks.push({ c, r: 0, hp, max: hp, tough });
  });
  cols.slice(n, n + CFG.pickupPerRow).forEach(c => st.pickups.push({ c, r: 0 }));
}

function descend(st) {
  st.bricks.forEach(b => b.r++); st.pickups.forEach(p => p.r++);
  st.pickups = st.pickups.filter(p => p.r < ROWS - 1);
}

// A falling row that lands on the mirror pushes it to the nearest empty cell below (concept §2.2): no illegal state.
function pushMirror(st) {
  const m = st.mirror; if (!m || !brickAt(st, m.c, m.r)) return;
  for (let r = m.r + 1; r < ROWS; r++) if (!brickAt(st, m.c, r)) { m.r = r; return; }
  let bd = 1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d = (c - m.c) ** 2 + (r - m.r) ** 2;
    if (!brickAt(st, c, r) && d < bd) { bd = d; m.c = c; m.r = r; }
  }
}

function fire(st) {
  if (st.phase !== 'aim') return;
  st.tele.turns++;
  if (st.mirror) { st.tele.mirrorTurns++; if (mirrorKey(st) !== st.aimStart) st.tele.changed++; }
  st.v = { balls: [], toLaunch: st.balls, tick: 0, nextLaunch: 0, gained: 0, hits: 0, maxM: 1 };
  st.phase = 'volley'; st.fast = false;
}

function tickVolley(st, fx) {
  const v = st.v;
  if (v.toLaunch > 0 && v.tick >= v.nextLaunch) { v.balls.push(launchBall(st)); v.toLaunch--; v.nextLaunch = v.tick + Math.round(CFG.launchGap / TICK); }
  for (const b of v.balls) if (!b.done) moveBall(st, b, CFG.speed * TICK, fx);
  v.tick++;
  return v.toLaunch === 0 && v.balls.every(b => b.done);
}

function endTurn(st) {
  st.balls += st.v.gained + (st.mode === 'endless' ? CFG.freeBallsPerTurn : 0);
  st.pickups = st.pickups.filter(p => !p.taken);
  st.bricks = st.bricks.filter(b => b.hp > 0);
  st.turn++; st.v = null;
  const over = () => st.bricks.some(b => b.r >= ROWS - 1);
  let res = null;
  if (st.mode === 'stage') {
    if (!st.bricks.length) res = 'clear';
    else {
      if (st.def.descend) { descend(st); pushMirror(st); if (over()) res = 'over'; }
      if (!res && st.turn >= st.def.turns) res = 'fail';
    }
  } else {
    descend(st); spawnRow(st, st.turn + 1); pushMirror(st);
    if (over()) res = 'over';
  }
  st.phase = res || 'aim';
  st.aimStart = mirrorKey(st);
  return res;
}

function teleSummary(st) {
  const T = st.tele;
  return {
    mode: st.mode === 'endless' ? 'endless' : 'stage ' + (st.idx + 1), result: st.phase, turns: T.turns,
    mirrorChangedPct: T.mirrorTurns ? Math.round(100 * T.changed / T.mirrorTurns) : null,
    maxMult: T.maxM, avgMultPerHit: T.hits ? +(T.multSum / T.hits).toFixed(2) : 0,
    runSeconds: Math.round((performance.now() - T.t0) / 1000), balls: st.balls,
  };
}

// ===== Debug bot + self-check (console: BF.bot('greedy'), BF.solve(stageIdx)) =====
function scorePath(st, depth) {
  return previewPath(st, depth).reduce((s, p) => s + (p.kind === 'brick' ? p.m * (1 + p.brick.r / ROWS) : 0), 0);
}
function bestMirror(st, depth) {
  let best = null, bs = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (brickAt(st, c, r)) continue;
    for (let a = 0; a < 180; a += 15) { st.mirror = { c, r, a }; const s = scorePath(st, depth); if (s > bs) { bs = s; best = st.mirror; } }
  }
  return best;
}
// depth = how many bounces the bot 'sees' (2 = same as the player's preview, 20 = near-perfect solver)
function bot(strategy = 'greedy', maxTurns = 150, seed = CFG.seed, depth = 20) {
  const old = CFG.seed; CFG.seed = seed; const st = newRun('endless'); CFG.seed = old;
  const rng = mulberry32(seed + 1);
  while (st.phase === 'aim' && st.turn < maxTurns) {
    if (strategy === 'greedy') st.mirror = bestMirror(st, depth);
    else if (strategy === 'random') { const m = { c: Math.floor(rng() * COLS), r: Math.floor(rng() * ROWS), a: 15 * Math.floor(rng() * 12) }; if (!brickAt(st, m.c, m.r)) st.mirror = m; }
    fire(st); let guard = 0; while (!tickVolley(st) && guard++ < 1e5); endTurn(st);
  }
  return teleSummary(st);
}
// For a stage: list single-turn mirror placements that clear the most bricks (validator idea from concept §12.1).
function solve(idx) {
  const out = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (let a = 0; a < 180; a += 15) {
    const st = newRun('stage', idx); if (brickAt(st, c, r)) continue;
    st.mirror = { c, r, a }; const before = st.bricks.reduce((s, b) => s + b.hp, 0);
    fire(st); while (!tickVolley(st)); const left = st.bricks.filter(b => b.hp > 0);
    out.push({ c, r, a, cleared: st.bricks.length - left.length, dmg: before - left.reduce((s, b) => s + Math.max(0, b.hp), 0), maxM: st.v.maxM });
  }
  return out.sort((x, y) => y.cleared - x.cleared || y.dmg - x.dmg);
}
function selfTest() {
  const st = newRun('stage', 0); st.bricks = []; st.mirror = null;
  const b = launchBall(st), h = cast(st, b.x, b.y, b.dx, b.dy, 1e9, false);
  console.assert(h.kind === 'wall' && h.nx === -1, 'first hit should be right wall');
  reflect(b, h); console.assert(b.dx < 0 && b.dy < 0, 'reflection flips x only');
  const runA = bot('none', 20, 7), runB = bot('none', 20, 7);
  console.assert(JSON.stringify({ ...runA, runSeconds: 0 }) === JSON.stringify({ ...runB, runSeconds: 0 }), 'volleys must be deterministic');
}
window.BF = { CFG, STAGES, bot, solve, selfTest, newRun, fire, tickVolley, endTurn, previewPath, get state() { return S; } };

// ===== Rendering =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
let S = null, scale = 1, popups = [], runLog = [];

function resize() {
  const h = Math.min(innerHeight, innerWidth * 16 / 9), w = h * 9 / 16, dpr = devicePixelRatio || 1;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); scale = cv.width / LW;
}
addEventListener('resize', resize);

const multColor = m => m >= CFG.maxMult ? '#ffffff' : m >= 8 ? '#ff9a3d' : m >= 4 ? '#ffd84f' : m >= 2 ? '#fff3a8' : '#e8ecf5';
function brickColor(f) { const c0 = [56, 225, 255], c1 = [255, 79, 216]; return `rgb(${c0.map((v, i) => Math.round(v + (c1[i] - v) * f)).join(',')})`; }

function pill(x, y, text, color) {
  ctx.font = 'bold 11px system-ui'; const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 17, w, 15, 7); ctx.fill();
  ctx.fillStyle = '#0b0f1a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y - 9.5);
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#0B0F1A'; ctx.fillRect(0, 0, LW, LH);
  if (!S) return;
  const st = S;
  // HUD
  ctx.fillStyle = '#dfe6f3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '600 15px system-ui';
  ctx.fillText(st.mode === 'endless' ? `ENDLESS  ·  Turn ${st.turn + 1}` : `STAGE ${st.idx + 1}  ·  Turn ${Math.min(st.turn + 1, st.def.turns)}/${st.def.turns}`, LW / 2, 22);
  ctx.font = '12px system-ui'; ctx.fillStyle = '#8a96ad';
  const vm = st.v ? st.v.maxM : 1;
  ctx.fillText(`balls ${st.balls}   ·   run max ×${st.tele.maxM}${st.v ? `   ·   volley ×${vm}` : ''}`, LW / 2, 44);

  ctx.save(); ctx.translate(AX, AY);
  // dot grid + border + danger line
  ctx.fillStyle = '#1a2236';
  for (let r = 0; r <= ROWS; r++) for (let c = 0; c <= COLS; c++) ctx.fillRect(c * CELL - 1, r * CELL - 1, 2, 2);
  ctx.strokeStyle = '#2c3550'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, AW, AH);
  ctx.strokeStyle = '#ff4f6a55'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(0, (ROWS - 1) * CELL); ctx.lineTo(AW, (ROWS - 1) * CELL); ctx.stroke(); ctx.setLineDash([]);
  // bricks
  const maxHp = Math.max(1, ...st.bricks.map(b => b.hp));
  for (const b of st.bricks) {
    if (b.hp <= 0) continue;
    const x = b.c * CELL + 3, y = b.r * CELL + 3, s = CELL - 6, col = brickColor(b.hp / maxHp);
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x, y, s, s);
    if (b.tough) ctx.strokeRect(x + 4, y + 4, s - 8, s - 8);
    ctx.fillStyle = col; ctx.font = `600 ${b.hp >= 100 ? 13 : 16}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.hp, x + s / 2, y + s / 2 + 1);
  }
  // pickups
  for (const p of st.pickups) {
    if (p.taken) continue;
    const x = p.c * CELL + CELL / 2, y = p.r * CELL + CELL / 2;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui'; ctx.fillText('+1', x, y + 1);
  }
  // preview (aim phase only)
  if (st.phase === 'aim') {
    const pts = previewPath(st, previewDepth(st));
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
    const lb = launchBall(st); ctx.beginPath(); ctx.moveTo(lb.x, lb.y); pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); ctx.setLineDash([]);
    pts.forEach(p => { if (p.kind !== 'floor') pill(p.x, p.y, '×' + p.m, p.kind === 'brick' ? '#ff9adf' : multColor(p.m)); });
  }
  // mirror
  if (st.mirror) {
    const s = mirrorSeg(st.mirror);
    ctx.strokeStyle = '#7CFF6B'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.qx, s.qy); ctx.stroke();
    ctx.fillStyle = '#7CFF6B'; ctx.beginPath(); ctx.arc(s.px, s.py, 3, 0, 7); ctx.fill();
    if (st.phase === 'aim') { ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.qx, s.qy, 8, 0, 7); ctx.stroke(); }
  }
  // balls
  if (st.v) for (const b of st.v.balls) {
    if (b.done) continue;
    const col = multColor(b.m);
    if (b.m >= CFG.maxMult) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 10; }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(b.x, b.y, CFG.ballR, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    if (b.m > 1) { ctx.font = 'bold 9px system-ui'; ctx.fillText('×' + b.m, b.x + 9, b.y - 7); }
  }
  // hit popups
  ctx.textAlign = 'center';
  popups = popups.filter(p => (p.life -= 1 / 60) > 0);
  for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2.5); ctx.fillStyle = multColor(p.m); ctx.font = `bold ${p.kill ? 14 : 11}px system-ui`; ctx.fillText('×' + p.m, p.x, p.y - (0.5 - p.life) * 30); }
  ctx.globalAlpha = 1;
  // launcher: half circle + fixed arrow (no aiming, lock K1)
  const a = launcherDeg(st) * Math.PI / 180;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(AW / 2, AH, 12, Math.PI, 0); ctx.stroke();
  const ex = AW / 2 + Math.cos(a) * 30, ey = AH - Math.sin(a) * 30;
  ctx.beginPath(); ctx.moveTo(AW / 2, AH); ctx.lineTo(ex, ey);
  ctx.lineTo(ex - 7 * Math.cos(a - 0.5), ey + 7 * Math.sin(a - 0.5)); ctx.moveTo(ex, ey); ctx.lineTo(ex - 7 * Math.cos(a + 0.5), ey + 7 * Math.sin(a + 0.5)); ctx.stroke();
  ctx.restore();

  // bottom bar: ball count, hint, FIRE
  ctx.fillStyle = '#dfe6f3'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('×' + (st.v ? st.v.toLaunch : st.balls), AX + AW / 2, AY + AH + 14);
  ctx.textAlign = 'left'; ctx.font = '14px system-ui'; ctx.fillStyle = '#9fb0cc';
  const hint = st.phase === 'volley' ? (st.fast ? 'Fast »' : 'Tap = fast forward') : st.mode === 'stage' ? st.def.hint : 'Move/rotate the mirror';
  ctx.fillText(hint, 16, FIRE.y + FIRE.h / 2);
  const on = st.phase === 'aim';
  ctx.fillStyle = on ? '#7CFF6B' : '#2c3550'; ctx.beginPath(); ctx.roundRect(FIRE.x, FIRE.y, FIRE.w, FIRE.h, 12); ctx.fill();
  ctx.fillStyle = on ? '#0b0f1a' : '#6b7894'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillText('FIRE', FIRE.x + FIRE.w / 2, FIRE.y + FIRE.h / 2 + 1);
}

// ===== Main loop =====
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && S.phase === 'volley') {
    acc += dt * (S.fast ? CFG.fastForward : 1);
    const fx = (x, y, m, kill) => { if (popups.length < 60) popups.push({ x, y, m, kill, life: 0.5 }); };
    while (acc >= TICK) {
      acc -= TICK;
      if (tickVolley(S, fx)) { acc = 0; const res = endTurn(S); if (res) showResult(res); break; }
    }
  }
  draw();
  requestAnimationFrame(frame);
}

// ===== Input: mirror drag (snap to empty cell centers), tap = +15°, handle drag = rotate with 15° snap =====
let drag = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * LW, y: (e.clientY - r.top) / r.height * LH }; }
cv.addEventListener('pointerdown', e => {
  if (!S) return;
  const p = toLogical(e);
  if (S.phase === 'volley') { S.fast = true; return; }
  if (S.phase !== 'aim') return;
  if (p.x >= FIRE.x && p.x <= FIRE.x + FIRE.w && p.y >= FIRE.y && p.y <= FIRE.y + FIRE.h) { fire(S); return; }
  if (!S.mirror) return;
  const a = { x: p.x - AX, y: p.y - AY }, s = mirrorSeg(S.mirror);
  if (Math.hypot(a.x - s.qx, a.y - s.qy) < 18) drag = { mode: 'rotate' };
  else if (segPointDist(s.px, s.py, s.qx, s.qy, a.x, a.y) < 18 || Math.hypot(a.x - s.cx, a.y - s.cy) < CELL / 2) drag = { mode: 'press', x0: a.x, y0: a.y };
  if (drag) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag || !S || S.phase !== 'aim') return;
  const p = toLogical(e), a = { x: p.x - AX, y: p.y - AY }, m = S.mirror, s = mirrorSeg(m);
  if (drag.mode === 'rotate') {
    const deg = Math.atan2(-(a.y - s.cy), a.x - s.cx) * 180 / Math.PI;
    m.a = ((Math.round(deg / 15) * 15) % 360 + 360) % 360;
  } else {
    if (drag.mode === 'press' && Math.hypot(a.x - drag.x0, a.y - drag.y0) > 8) drag.mode = 'move';
    if (drag.mode === 'move') {
      const c = Math.max(0, Math.min(COLS - 1, Math.floor(a.x / CELL))), r = Math.max(0, Math.min(ROWS - 1, Math.floor(a.y / CELL)));
      if (!brickAt(S, c, r)) { m.c = c; m.r = r; }
    }
  }
});
const endDrag = () => { if (drag && drag.mode === 'press' && S.mirror) S.mirror.a = (S.mirror.a + 15) % 360; drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 't' || e.key === 'T') return togglePanel();
  if (!S) return;
  if (e.key === ' ') { e.preventDefault(); if (S.phase === 'volley') S.fast = true; else fire(S); }
  if (S.phase !== 'aim' || !S.mirror) return;
  const m = S.mirror, mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (e.key === 'r' || e.key === 'R') m.a = (m.a + 15) % 360;
  if (mv) { const c = m.c + mv[0], r = m.r + mv[1]; if (c >= 0 && c < COLS && r >= 0 && r < ROWS && !brickAt(S, c, r)) { m.c = c; m.r = r; } e.preventDefault(); }
});

// ===== Menus, result screen, panel =====
const $ = id => document.getElementById(id);
function start(mode, idx) { S = newRun(mode, idx); popups = []; $('menu').classList.remove('on'); $('result').classList.remove('on'); }
STAGES.forEach((d, i) => { const b = document.createElement('button'); b.textContent = `Stage ${i + 1} · ${d.hint}`; b.onclick = () => start('stage', i); $('stageBtns').appendChild(b); });
$('btnEndless').onclick = () => start('endless');
$('btnMenu').onclick = () => { $('result').classList.remove('on'); $('menu').classList.add('on'); };
$('resMenu').onclick = () => { $('result').classList.remove('on'); $('menu').classList.add('on'); };

function showResult(res) {
  const sum = teleSummary(S); runLog.push(sum); console.log('[run]', sum);
  const next = S.mode === 'stage' && res === 'clear' && S.idx + 1 < STAGES.length;
  $('resTitle').textContent = { clear: 'STAGE CLEAR', fail: 'OUT OF TURNS', over: 'GAME OVER' }[res];
  $('resText').textContent = `turns          ${sum.turns}\nmirror changed ${sum.mirrorChangedPct ?? '-'}%\nmax mult       ×${sum.maxMult}\navg mult/hit   ×${sum.avgMultPerHit}\nrun length     ${sum.runSeconds}s`;
  $('resMain').textContent = next ? `Next: Stage ${S.idx + 2}` : (S.mode === 'stage' && res === 'clear' ? 'Play Endless' : 'Retry');
  const mode = S.mode, idx = S.idx;
  $('resMain').onclick = () => next ? start('stage', idx + 1) : (mode === 'stage' && res === 'clear' ? start('endless') : start(mode, idx));
  $('result').classList.add('on');
}

function togglePanel() { $('panel').classList.toggle('on'); }
$("btnPanel").onclick = $("btnClose").onclick = togglePanel;
for (const k of Object.keys(CFG)) {
  const l = document.createElement('label'), i = document.createElement('input');
  i.type = 'number'; i.step = 'any'; i.value = CFG[k];
  i.oninput = () => { const v = parseFloat(i.value); if (Number.isFinite(v)) CFG[k] = v; };
  l.append(k, i); $('knobs').appendChild(l);
}
$('btnRestart').onclick = () => S && start(S.mode, S.idx);
$('btnCopy').onclick = () => navigator.clipboard?.writeText(JSON.stringify({ cfg: CFG, runs: runLog, current: S && teleSummary(S) }, null, 1));
$('btnClear').onclick = () => { runLog = []; };
setInterval(() => {
  if (!$('panel').classList.contains('on')) return;
  const cur = S ? teleSummary(S) : null, all = runLog.concat(cur ? [cur] : []);
  const turns = all.reduce((s, r) => s + r.turns, 0);
  $('tele').textContent = (cur ? `CURRENT RUN\n${JSON.stringify(cur, null, 1)}\n\n` : '') +
    `SESSION: ${runLog.length} finished runs, ${turns} turns\n` +
    runLog.map(r => `${r.mode} ${r.result} t${r.turns} chg${r.mirrorChangedPct ?? '-'}% max×${r.maxMult} avg×${r.avgMultPerHit} ${r.runSeconds}s`).join('\n');
}, 500);

resize();
selfTest();
requestAnimationFrame(frame);
</script>
</body>
</html>
