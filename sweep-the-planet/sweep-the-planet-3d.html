<style>
  html,body{margin:0;height:100%;background:#141022;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eee}
  #wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
  #wrap canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
  #btnPanel{position:fixed;top:6px;right:6px;z-index:5;width:34px;height:34px;border-radius:17px;border:0;background:rgba(43,38,64,.85);color:#b9b0cf;font-size:17px;cursor:pointer;box-shadow:0 3px 0 rgba(20,16,34,.35)}
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(390px,100vw);z-index:4;background:rgba(30,26,46,.97);overflow:auto;padding:46px 12px 20px;box-sizing:border-box;font-size:12px;display:none}
  #panel h3{margin:14px 0 6px;font-size:13px;color:#FFC857}
  #panel button{background:#2a303a;color:#eee;border:1px solid #445;border-radius:6px;padding:5px 8px;margin:2px;font-size:12px;cursor:pointer}
  #panel button.on{background:#FFC857;color:#2b2640}
  #panel textarea{width:100%;background:#191c22;color:#eee;border:1px solid #444;border-radius:4px;font:11px monospace;box-sizing:border-box}
  #panel pre{white-space:pre-wrap;font:11px/1.35 monospace;background:#191c22;padding:6px;border-radius:6px;margin:4px 0;overflow-x:auto}
  #cheat{position:fixed;left:50%;top:70px;transform:translateX(-50%);width:min(360px,calc(100vw - 16px));z-index:7;background:rgba(40,12,12,.96);border:1px solid #ff7a5a;border-radius:12px;padding:10px;box-sizing:border-box;font-size:12px;display:none}
  #cheat h3{margin:0 0 6px;font-size:13px;color:#ff7a5a;display:flex;justify-content:space-between;align-items:center}
  #cheat button{background:#3a2020;color:#fff;border:1px solid #6a3a3a;border-radius:6px;padding:7px 8px;margin:2px;font-size:12px;cursor:pointer}
  #cheat button.on{background:#ff7a5a;color:#111}
  #cheat .row{margin:4px 0}
  #cheat small{color:#c9a0a0;display:block;margin-top:6px}
  #cap{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:8;display:none;align-items:center;justify-content:center;gap:6px;background:#0d0a18;font:12px system-ui}

<script type="module">
// Sweep the Planet 3D greybox: Three.js r160 (local copy in lib/, MIT, see lib/three-LICENSE.txt).
// Camera, world, player, workers and storm are 3D; HUD, joystick and popups are a 2D overlay canvas.
// World vs UI split follows 01_riset/batch7c-ui-vs-inworld-upgrade-2026-11-20.md §5-6:
//   cash, dust and space = in-world (sell at Depot, pay zones for sector gates, tool tiers, Keeper hire), cash visibly flows;
//   number choices = small panel opened by standing on a pad (terminal: 5 stat branches; Refinery: Fuel share; Launch: confirm);
//   meta/progress = HUD (cash + $/s, Moon % bar + Grid %, Shop, later Fuel / Star Map).
import * as THREE from 'three'; // importmap above: GLTFLoader imports the bare 'three' specifier
import { GLTFLoader } from './lib/addons/loaders/GLTFLoader.js';
// P0-2 creative capture: ?capture=s1|s2|s3 = UI-off 9:16 frame (390 x 693), fixed seed, scripted camera, record bar outside the frame.
const CAPTURE = ((new URLSearchParams(location.search).get('capture') || '').toLowerCase().match(/^s[123]$/) || [null])[0];
const W = 390, H = CAPTURE ? 693 : 844, HUD_H = 60;
// in-world pads: rects come from the sim (PADZ, clean foundation, outside the Depot so they never sell). kind: 'panel' opens a sheet, 'pay' is a pay zone.
// One palette for world and UI: plum night, cream buildings, warm orange accent, soft lilac Moon; pad colours below.
const PAL = { plum: '#2b2640', plumHi: '#3a3354', cream: '#FFF6E8', orange: '#FF8A3D', yellow: '#FFC857', teal: '#3FC8B8', mint: '#8EE3B5', purple: '#B48CFF', red: '#FF6B57', mute: '#b9b0cf' };
const ZONES = {
  terminal: Object.assign({ kind: 'panel', label: 'UPGRADES', bg: PAL.teal }, PADZ.terminal),
  tool: Object.assign({ kind: 'pay', label: 'TOOL RACK', bg: PAL.yellow }, PADZ.tool),
  crew: Object.assign({ kind: 'pay', label: 'CREW BAY', bg: PAL.mint }, PADZ.crew),
  helper: Object.assign({ kind: 'pay', label: 'HELPER BOT', bg: PAL.orange }, PADZ.helper), // Mercury: Helper Robot hire, next to the Crew Bay
  refinery: Object.assign({ kind: 'panel', label: 'REFINERY', bg: PAL.purple }, PADZ.refinery),
  launch: Object.assign({ kind: 'panel', label: 'LAUNCH', bg: PAL.orange }, PADZ.launch),
};
const CAM = { fov: 34, pitchDeg: 56, yawDeg: 30, dist: 44, follow: 4.5, widthZoom: 0.07, planetDist: 175, planetPitchDeg: 30, lookAhead: 0.8, baseBias: 0.8 };
const errBox = document.getElementById('err');
addEventListener('error', e => { errBox.style.display = 'block'; errBox.textContent += (e.message || e) + '\n'; });

// ----- sizing (portrait 390 x 844 logical, fit to window like the 2D greybox) -----
const wrap = document.getElementById('wrap'), glCanvas = document.getElementById('gl'), ui = document.getElementById('ui'), ctx = ui.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setClearColor(0x141022);
let scale = 1;
function resize() {
  const capH = CAPTURE ? 52 : 0; wrap.style.top = CAPTURE ? 'calc(50% - 26px)' : ''; // capture: record bar below the frame, never in it
  scale = Math.min(innerWidth / W, (innerHeight - capH) / H); const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = W * scale, ch = H * scale;
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  renderer.setPixelRatio(dpr); renderer.setSize(cw, ch, true);
  ui.style.width = cw + 'px'; ui.style.height = ch + 'px'; ui.width = Math.round(cw * dpr); ui.height = Math.round(ch * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ----- scene -----
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CAM.fov, W / H, 0.5, 1400);
// lighting: warm key + cool sky/fill. Models are toon-shaded (3 bands) with a warm rim term (toon() below).
scene.add(new THREE.HemisphereLight(0xc4c8ff, 0x5d4f6e, 1.5));
const sun = new THREE.DirectionalLight(0xffe2c2, 2.4); sun.position.set(-20, 40, 25); scene.add(sun);
const fillLight = new THREE.DirectionalLight(0x9fb2ff, 0.7); fillLight.position.set(30, 12, -25); scene.add(fillLight);
const toonRamp = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat); toonRamp.magFilter = toonRamp.minFilter = THREE.NearestFilter; toonRamp.needsUpdate = true;
const RIM = 'float rimK = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 2.5); outgoingLight += vec3(1.0, 0.86, 0.72) * rimK * 0.45;\n#include <opaque_fragment>';
const addRim = s => { s.fragmentShader = s.fragmentShader.replace('#include <opaque_fragment>', RIM); };
function toon(color, extra = {}, rim = true) { const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: toonRamp }, extra)); if (rim) m.onBeforeCompile = addRim; return m; }
const lam = toon; // primitive fallbacks use the same look
// inverted-hull outline (characters and buildings only)
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x2b2238, side: THREE.BackSide });
outlineMat.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normalize(normal) * 0.03;'); };
function addOutline(obj) { const list = []; obj.traverse(o => { if (o.isMesh && !o.userData.ol && o.material !== outlineMat && !o.material.transparent) list.push(o); }); for (const m of list) { const ol = new THREE.Mesh(m.geometry, outlineMat); ol.userData.ol = true; m.add(ol); } return obj; }
const v3 = hex => new THREE.Vector3((hex >> 16 & 255) / 255, (hex >> 8 & 255) / 255, (hex & 255) / 255); // shader colours are display values
function softTex(stops) { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32); stops.forEach(([k, a]) => g.addColorStop(k, 'rgba(255,255,255,' + a + ')')); c.fillStyle = g; c.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cv); }
// soft blob (contact) shadows
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), blobMat = new THREE.MeshBasicMaterial({ map: softTex([[0, 0.55], [0.55, 0.3], [1, 0]]), color: 0x231a35, transparent: true, depthWrite: false });
function blob(parent, sx, sz, x = 0, z = 0) { const m = new THREE.Mesh(blobGeo, blobMat); m.scale.set(sx, 1, sz); m.position.set(x, 0.02, z); m.renderOrder = 1; parent.add(m); return m; }

// ===== Station deck + Lit look =====
// Fiction: a buried moon station deck lies under the regolith; sweeping it brings the station back online (Clean = Power).
// Dust IS the moon's regolith: same colour and grain as the terrain around the map (REGOLITH_GLSL is shared by both shaders), so
// dirty deck, map edge and moon read as one surface. Clean deck = calm, big plates (plate x plate tiles) with thin low-contrast seams;
// the seams are the light lanes: each tile next to a seam carries a short lane light that powers up (warm flicker, flickerSec) when the
// tile turns Lit, and the Lit tile brightens its plate softly. Hatches on ~1 in 12 plates. A storm-dusted tile goes dark (unpowered).
// Grid Link = the lane seam glowing warm, pulsing toward the Depot. LIT_LOOK + deckSurface() are the single place for this look.
const LIT_LOOK = { deck: 0xe8e9ee, seam: 0x9c9dad, strip: 0xffc47a, stripOff: 0x7d778f, link: 0xffa94d, linkGlow: 0.5, gloss: 0.14, flickerSec: 0.7, unpowered: 0.86, plate: 4, hatchOdds: 1 / 12 };
const GROUND = { regolith: 0x6f6783, trim: 0x8a8399, marker: 0xff8a3d };
// P0-3: per-planet palette (index = sim S.planet). Mercury = orange regolith, yellow-hot sky, the Sun instead of Earth.
const PLANET_LOOK = [
  { regolith: GROUND.regolith, trim: GROUND.trim, clear: 0x141022, rock: 0x625b75, crater: 0x554e6a, earth: true },
  { regolith: 0xd98a45, trim: 0xc27a3a, clear: 0x2a1608, rock: 0xb0703a, crater: 0xb86a30, earth: false },
];
const SETTLE_SEC = 1.2; // storm dust settles into the mask over this long (no floor wave)
const sunU = { value: sun.position.clone().normalize() }, regU = { value: v3(GROUND.regolith) }, alarmU = { value: 0 };
const REGOLITH_GLSL = `
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }
    uniform vec3 uSun; uniform vec3 uReg; uniform float uAlarm;
    // moon regolith: one colour, two grain scales, soft large blotches, lit by the sun through a fluffy normal
    vec3 regolith(vec2 g, vec3 N0){
      float fluff = vn(g * 2.6) * 0.6 + vn(g * 7.0) * 0.4;                                     // low-frequency, low-contrast: soft dust, not static
      vec3 N = normalize(N0 + vec3((fluff - 0.5) * 0.2, 0.0, (vn(g * 2.6 + 5.0) - 0.5) * 0.2));
      return uReg * (0.94 + 0.09 * fluff) * (0.95 + 0.07 * vn(g * 0.35)) * (0.76 + 0.32 * max(dot(N, uSun), 0.0));
    }
    vec3 alarm(vec3 c){ return mix(c, vec3(1.0, 0.25, 0.2), uAlarm * 0.16); }`;

// ground: one plane. Per-tile state in a 48 x 72 DataTexture (R dust mean, G flags, B Grid Link dir+dist, A power-up / settle age);
// the dust itself is the sim's fine mask (S.sub, 6 x 6 cells per tile) in a second DataTexture: threshold = clean edge, level =
// thickness, gradient = soft height normal. Only the changed rectangle of the mask is uploaded per frame.
const tileData = new Uint8Array(N * 4), tileTex = new THREE.DataTexture(tileData, C, R, THREE.RGBAFormat);
tileTex.magFilter = tileTex.minFilter = THREE.NearestFilter; tileTex.needsUpdate = true;
const maskTex = new THREE.DataTexture(new Uint8Array(1), 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
maskTex.magFilter = maskTex.minFilter = THREE.LinearFilter; maskTex.unpackAlignment = 1;
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uTiles: { value: tileTex }, uMask: { value: maskTex }, uMaskSize: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uGrid: { value: new THREE.Vector2(C, R) },
    uSun: sunU, uReg: regU, uAlarm: alarmU, uDeck: { value: v3(LIT_LOOK.deck) }, uSeam: { value: v3(LIT_LOOK.seam) }, uStrip: { value: v3(LIT_LOOK.strip) }, uStripOff: { value: v3(LIT_LOOK.stripOff) },
    uLink: { value: v3(LIT_LOOK.link) }, uPlate: { value: LIT_LOOK.plate }, uHatch: { value: LIT_LOOK.hatchOdds }, uLinkGlow: { value: LIT_LOOK.linkGlow }, uGloss: { value: LIT_LOOK.gloss }, uUnpow: { value: LIT_LOOK.unpowered },
    uTrim: { value: v3(GROUND.trim) }, uMarker: { value: v3(GROUND.marker) },
  },
  vertexShader: 'varying vec2 vUv; varying vec3 vWorld; void main(){ vUv = uv; vWorld = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0); }',
  fragmentShader: `
    precision highp float; uniform sampler2D uTiles; uniform sampler2D uMask; uniform vec2 uMaskSize; uniform float uTime; uniform vec2 uGrid;
    uniform vec3 uDeck; uniform vec3 uSeam; uniform vec3 uStrip; uniform vec3 uStripOff; uniform vec3 uLink; uniform float uPlate; uniform float uHatch; uniform float uLinkGlow; uniform float uGloss; uniform float uUnpow;
    uniform vec3 uTrim; uniform vec3 uMarker; varying vec2 vUv; varying vec3 vWorld;
    ${REGOLITH_GLSL}
    float bit(float f, float b){ return mod(floor(f / b), 2.0); }
    // ---- station deck (values from LIT_LOOK); on = lane light power 0..1. Every line is anti-aliased with fwidth (no shimmer) ----
    vec3 deckSurface(vec2 g, vec2 cell, vec2 f, float on, float linked, float dist, float shine){
      float w = max(fwidth(g.x), fwidth(g.y)), P = uPlate;
      vec2 pc = floor(g / P), pe = abs(fract(g / P + 0.5) - 0.5) * P;                     // pe = distance (tiles) to the nearest plate seam per axis
      float sd = min(pe.x, pe.y);
      vec3 col = uDeck * (0.98 + 0.04 * h(pc)) * (0.975 + 0.025 * smoothstep(0.0, 0.6, sd));  // gentle tone per plate, soft bevel to the seam
      col = mix(col, uSeam, (1.0 - smoothstep(0.03, 0.03 + 1.5 * w, sd)) * 0.5);           // thin seam
      if (h(pc + 7.13) < uHatch) {                                                          // sparse hatch, same orientation everywhere
        vec2 q = (fract(g / P) - 0.5) * P; float r = length(q);
        float ring = 1.0 - smoothstep(0.04, 0.04 + 1.5 * w, abs(r - 0.85));
        float slat = step(r, 0.62) * (1.0 - smoothstep(0.035, 0.035 + 1.5 * w, abs(fract(q.y / 0.3) - 0.5) * 0.3));
        col = mix(col, uSeam, max(ring, slat * 0.7) * 0.4);
      }
      // lane light: a short strip 0.16 tile inside the seam on tiles that touch one (cells on the plate's outer ring)
      vec2 cp = mod(cell, P); float lane = 0.0, acr = 9.0;
      if (cp.x < 0.5 || cp.x > P - 1.5) { float a = abs((cp.x < 0.5 ? f.x : 1.0 - f.x) - 0.16); acr = min(acr, a); lane = max(lane, (1.0 - smoothstep(0.035, 0.035 + w, a)) * (1.0 - smoothstep(0.3, 0.3 + w, abs(f.y - 0.5)))); }
      if (cp.y < 0.5 || cp.y > P - 1.5) { float a = abs((cp.y < 0.5 ? f.y : 1.0 - f.y) - 0.16); acr = min(acr, a); lane = max(lane, (1.0 - smoothstep(0.035, 0.035 + w, a)) * (1.0 - smoothstep(0.3, 0.3 + w, abs(f.x - 0.5)))); }
      col *= mix(uUnpow, 1.04, on);                                                         // a Lit tile brightens its patch of plate softly
      col = mix(col, mix(uStripOff, uStrip * 1.1, on), lane * mix(0.35, 0.8, on));
      col += uStrip * on * 0.12 * exp(-acr * 10.0) * step(acr, 8.0);                       // soft spill from the lane light
      vec3 V = normalize(cameraPosition - vWorld); col += uGloss * pow(max(dot(reflect(-uSun, vec3(0.0, 1.0, 0.0)), V), 0.0), 6.0);
      if (shine > 0.5) col += 0.04 * (0.6 + 0.4 * sin(uTime * 3.0 + cell.x * 0.5));       // Mop: still wet
      if (linked > 0.5) {                                                                    // Grid Link: the lane seam glows, pulse flows toward the Depot
        float core = 1.0 - smoothstep(0.03, 0.03 + 1.5 * w, sd), pulse = 0.5 + 0.5 * sin(dist * 1.3 + uTime * 5.0);
        col = mix(col, uLink, core * step(acr, 8.0) * uLinkGlow * (0.55 + 0.45 * pulse));
      }
      return col;
    }
    void main(){
      vec2 g = vec2(vUv.x * uGrid.x, (1.0 - vUv.y) * uGrid.y), cell = floor(g), f = fract(g), mu = g / uGrid;
      vec4 t = texture2D(uTiles, (cell + 0.5) / uGrid);
      float dirt = t.r, fl = floor(t.g * 255.0 + 0.5), b = floor(t.b * 255.0 + 0.5), dist = mod(b, 64.0), age = t.a;
      float ever = bit(fl, 1.0), linked = bit(fl, 2.0), locked = bit(fl, 4.0), plate = bit(fl, 8.0), shine = bit(fl, 16.0), gate = bit(fl, 32.0), settle = bit(fl, 64.0), rock = bit(fl, 128.0);
      vec3 col;
      if (plate > 0.5) col = deckSurface(g, cell, f, 1.0, 0.0, 0.0, 0.0);                   // foundations: station already powered
      else if (rock > 0.5) col = regolith(g, vec3(0.0, 1.0, 0.0)) * 0.92;
      else {
        float lit = dirt < 0.003 && ever > 0.5 ? 1.0 : 0.0;
        float on = lit * (settle < 0.5 && age < 0.999 ? step(0.4, h(cell + floor(age * 14.0))) * smoothstep(0.0, 0.15, age) + step(0.85, age) * 0.6 : 1.0); // power-up flicker
        col = deckSurface(g, cell, f, on, linked * lit, dist, shine * lit);                // unlit = dark, unpowered deck (also after a storm)
        // regolith dust from the mask: soft height normal from its gradient, darker rim at the clean edge, contact shade on the clean side
        vec2 px = 1.0 / uMaskSize; float d0 = texture2D(uMask, mu).r;
        float dR = texture2D(uMask, mu + vec2(px.x, 0.0)).r, dL = texture2D(uMask, mu - vec2(px.x, 0.0)).r, dU = texture2D(uMask, mu + vec2(0.0, px.y)).r, dD = texture2D(uMask, mu - vec2(0.0, px.y)).r;
        float gx = dR - dL, gy = dU - dD, d = (2.0 * d0 + dR + dL + dU + dD) / 6.0;          // 1-cell feather: soft edge, no stair steps
        if (settle > 0.5) d *= smoothstep(0.0, 1.0, age);                                       // storm dust settles in
        float cover = smoothstep(0.02, 0.3, d);
        vec3 dust = regolith(g, vec3(-gx * 1.1, 1.0, -gy * 1.1));
        dust *= 1.0 - 0.28 * (cover - smoothstep(0.3, 0.6, d));                                // faint rim where the dust thins
        col = mix(col, dust, cover * mix(0.55, 1.0, d));
      }
      if (locked > 0.5) { // sealed sector: hull rim and a closed hatch marker show faintly through the dust
        vec2 sq = g - (floor(g / 24.0) * 24.0 + 12.0), se = min(mod(g, 24.0), 24.0 - mod(g, 24.0));
        float rim = 1.0 - smoothstep(0.25, 0.4, min(se.x, se.y));
        float ring = 1.0 - smoothstep(0.08, 0.16, abs(length(sq) - 2.4)), bars = step(length(sq), 2.4) * (1.0 - smoothstep(0.08, 0.16, abs(sq.x - sq.y) * 0.7071)) + step(length(sq), 2.4) * (1.0 - smoothstep(0.08, 0.16, abs(sq.x + sq.y) * 0.7071));
        col *= 0.94; col = mix(col, uSeam, 0.35 * max(rim, max(ring, min(bars, 1.0))));
      }
      if (gate > 0.5 && mod(cell.x + cell.y, 2.0) < 1.0) col = mix(col, vec3(1.0, 0.78, 0.34), 0.55);
      // station hull rim around the whole deck: bevelled trim with marker lights, partly buried by regolith spilling over the edge
      float dE = min(min(g.x, g.y), min(uGrid.x - g.x, uGrid.y - g.y));
      if (dE < 0.9) {
        float trim = 1.0 - step(0.32, dE), top = smoothstep(0.0, 0.12, dE) * (1.0 - smoothstep(0.2, 0.32, dE));
        vec3 tc = uTrim * (0.78 + 0.35 * top);
        float along = dE == g.x || dE == uGrid.x - g.x ? g.y : g.x;
        float mk = (1.0 - smoothstep(0.06, 0.1, length(vec2(fract(along / 4.0) * 4.0 - 2.0, dE - 0.16)))) ;
        tc = mix(tc, uMarker * (0.8 + 0.4 * sin(uTime * 2.0 + along)), mk);
        col = mix(col, tc, trim);
        float n = vn(g * 2.7) * 0.6 + vn(g * 8.0) * 0.4, spill = smoothstep(0.48, 0.62, n + (0.55 - dE) * 0.9);
        col = mix(col, regolith(g, vec3(0.0, 1.0, 0.0)), spill);
      }
      gl_FragColor = vec4(alarm(col), 1.0);

  { id: 'depot', text: 'Canister full: walk into the Depot to sell', when: S => S.can >= capKg(S) - 1e-6 || S.tele.firstSell != null, done: S => S.tele.firstSell != null },
  { id: 'cap', text: 'Stand on UPGRADES and buy Capacity', when: S => canBuy(S, 'capacity') || S.up.capacity > 0, done: S => S.up.capacity > 0, zone: 'terminal' },
  { id: 'gate', text: 'Stand on the gold pad to open Sector 2', when: S => S.unlocked[1] || S.cash >= gateCost(S, 1) - S.gatePaid, done: S => S.unlocked[1] },
  { id: 'storm', force: true, text: 'Dust Storm! Lit panels go dark: sweep them again', when: S => S.storm.count > 0 || S.storm.phase !== 'idle', done: S => S.keepers.length > 0 || (S.storm.count > 0 && S.t - S.ftue.shownAt.storm > 10) },
  { id: 'keeper', text: 'Free Keeper Drone at the CREW BAY', when: S => canBuy(S, 'keeper') || S.keepers.length > 0, done: S => S.keepers.length > 0, zone: 'crew' },

  teleTimer += real; if (teleTimer > 0.5 && panel.style.display === 'block') { teleTimer = 0; const el = document.getElementById('tele'); if (el) el.textContent = teleText(G); const ei = document.getElementById('evInfo'); if (ei) ei.textContent = `events ${evLog.length} (session ${SESSION}) | last: ${evLog.slice(-4).map(e => e.name).join(', ') || '–'}\nsave: ${((lsGet(LS.save) || '').length / 1024).toFixed(1)} kB, every 10 s + on tab hide | cfg ${cfgHash(CONFIG)}`; }
  if (Math.floor(G.t / 60) > logMin) { logMin = Math.floor(G.t / 60); const m = G.tele.min[logMin - 1]; if (m) console.log('[tele]', JSON.stringify({ m: logMin, lit: Math.round(m.lit), sell: Math.round(m.sell), litTiles: G.litCount })); }
}
function frame(now) { tick(now); requestAnimationFrame(frame); }
SP.tick = (n = 1, ms = 1000 / 60) => { for (let i = 0; i < n; i++) tick(last + ms); };
requestAnimationFrame(frame);
</script>
