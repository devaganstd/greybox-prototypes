// ===== Station deck + Lit look =====
// Fiction: a buried moon station deck lies under the regolith; sweeping it brings the station back online (Clean = Power).
// Dust IS the moon's regolith: same colour and grain as the terrain around the map (REGOLITH_GLSL is shared by both shaders), so
// dirty deck, map edge and moon read as one surface. Clean deck = composite panels (seams, bolts, vents) with an inset light strip.
// LIT_LOOK + deckSurface() below are the single place for the clean / Lit look: when a tile turns Lit its strip powers up with a

const LIT_LOOK = { deck: 0xa9a3b8, seam: 0x5b556c, strip: 0xffc47a, stripOff: 0x4d475e, link: 0xffa94d, linkWidth: 0.05, linkGlow: 0.85, gloss: 0.3, flickerSec: 0.7, unpowered: 0.8 };
const GROUND = { regolith: 0x9a91a8, trim: 0x8a8399, marker: 0xff8a3d };
const SETTLE_SEC = 1.2; // storm dust settles into the mask over this long (no floor wave)
const sunU = { value: sun.position.clone().normalize() }, regU = { value: v3(GROUND.regolith) }, alarmU = { value: 0 };

    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    vec3 regolith(vec2 g, vec3 N0){

      vec3 N = normalize(N0 + vec3((fluff - 0.5) * 0.45, 0.0, (vn(g * 14.0 + 5.0) - 0.5) * 0.45));

// the dust itself is the sim's fine mask (S.sub, 6 x 6 cells per tile) in a second DataTexture: threshold = clean edge, level =
// thickness, gradient = soft height normal. Only the changed rectangle of the mask is uploaded per frame.
const tileData = new Uint8Array(N * 4), tileTex = new THREE.DataTexture(tileData, C, R, THREE.RGBAFormat);
tileTex.magFilter = tileTex.minFilter = THREE.NearestFilter; tileTex.needsUpdate = true;
const maskTex = new THREE.DataTexture(new Uint8Array(1), 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
maskTex.magFilter = maskTex.minFilter = THREE.LinearFilter; maskTex.unpackAlignment = 1;
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uTiles: { value: tileTex }, uMask: { value: maskTex }, uMaskSize: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uGrid: { value: new THREE.Vector2(C, R) },
    uSun: sunU, uReg: regU, uAlarm: alarmU, uDeck: { value: v3(LIT_LOOK.deck) }, uSeam: { value: v3(LIT_LOOK.seam) }, uStrip: { value: v3(LIT_LOOK.strip) }, uStripOff: { value: v3(LIT_LOOK.stripOff) },
    uLink: { value: v3(LIT_LOOK.link) }, uLinkW: { value: LIT_LOOK.linkWidth }, uLinkGlow: { value: LIT_LOOK.linkGlow }, uGloss: { value: LIT_LOOK.gloss }, uUnpow: { value: LIT_LOOK.unpowered },

  vertexShader: 'varying vec2 vUv; varying vec3 vWorld; void main(){ vUv = uv; vWorld = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0); }',
  fragmentShader: `
    precision highp float; uniform sampler2D uTiles; uniform sampler2D uMask; uniform vec2 uMaskSize; uniform float uTime; uniform vec2 uGrid;
    uniform vec3 uDeck; uniform vec3 uSeam; uniform vec3 uStrip; uniform vec3 uStripOff; uniform vec3 uLink; uniform float uLinkW; uniform float uLinkGlow; uniform float uGloss; uniform float uUnpow;
    uniform vec3 uTrim; uniform vec3 uMarker; varying vec2 vUv; varying vec3 vWorld;

    float bit(float f, float b){ return mod(floor(f / b), 2.0); }
    // ---- station deck panel (values from LIT_LOOK); on = strip power 0..1 ----

// push the sim's changed mask rectangle to the GPU (texSubImage2D on the dirty region only; a new game re-binds the whole array)

function buildPanel() {
  let h = '<h3>Time</h3>' + [1, 4, 10].map(s => `<button data-speed="${s}" class="${speed === s ? 'on' : ''}">x${s}</button>`).join('') +
    `<button id="bReset">Reset</button><button id="bSkip">Skip 1 hour (offline)</button><button id="bCash">+$1000</button><button id="bSnd" class="${soundOn ? 'on' : ''}">Sound</button><button id="bSiren" class="${sirenOn ? 'on' : ''}">Siren</button><button id="bZoom">Zoom to planet</button>`;
  h += '<button id="bCheat">Cheats (` or tap cash 5×)</button>';
  h += '<h3>Camera</h3>' + ['pitchDeg', 'yawDeg', 'dist', 'fov'].map(k => `<label style="display:flex;justify-content:space-between">${k} <input type="number" step="any" data-cam="${k}" value="${CAM[k]}" style="width:70px"></label>`).join('');
  h += '<h3>Telemetry (this session)</h3><pre id="tele"></pre><button id="bCopy">Copy JSON</button>';
  h += '<h3>Bot (headless, seeds 1-3; same sim as 2D)</h3><button id="bBot">Run GB1-GB4 report</button><div id="botOut"></div>';
  h += '<h3>CONFIG (live; grid changes need Reset)</h3><textarea id="cfg" rows="18">' + JSON.stringify(CONFIG, null, 1) + '</textarea><button id="bApply">Apply</button><button id="bApplyReset">Apply + Reset</button><span id="cfgErr"></span>';
  h += '<h3>selfTest</h3><pre>' + JSON.stringify(selfTestResult) + '</pre>';
  panel.innerHTML = h;
  panel.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { speed = +b.dataset.speed; buildPanel(); });
  panel.querySelectorAll('[data-cam]').forEach(i => i.onchange = () => { CAM[i.dataset.cam] = +i.value; camera.fov = CAM.fov; camera.updateProjectionMatrix(); });
  panel.querySelector('#bCheat').onclick = () => { panel.style.display = 'none'; toggleCheat(); };
  panel.querySelector('#bReset').onclick = () => { G = startGame(); camState.init = false; };
  panel.querySelector('#bSkip').onclick = () => { skipOffline(G, 60); panel.style.display = 'none'; };
  panel.querySelector('#bCash').onclick = () => { G.cash += 1000; };
  panel.querySelector('#bSnd').onclick = () => { soundOn = !soundOn; buildPanel(); };
  panel.querySelector('#bSiren').onclick = () => { sirenOn = !sirenOn; buildPanel(); };
  panel.querySelector('#bZoom').onclick = () => { G.zoomAt = G.t; panel.style.display = 'none'; };
  panel.querySelector('#bCopy').onclick = () => navigator.clipboard?.writeText(JSON.stringify({ config: CONFIG, telemetry: teleSummary(G), cheats: G.tele.cheats || [] }, null, 1));
  const apply = reset => { try { const v = JSON.parse(panel.querySelector('#cfg').value); for (const k of Object.keys(CONFIG)) delete CONFIG[k]; Object.assign(CONFIG, v); panel.querySelector('#cfgErr').textContent = ' applied'; if (reset) G = startGame(); } catch (e) { panel.querySelector('#cfgErr').textContent = ' ' + e.message; } };
  panel.querySelector('#bApply').onclick = () => apply(false); panel.querySelector('#bApplyReset').onclick = () => apply(true);
  panel.querySelector('#bBot').onclick = () => { const out = panel.querySelector('#botOut'); out.textContent = 'running (±10-30 s)...'; setTimeout(() => { const r = botReport(); delete r.runs; out.innerHTML = '<pre>' + JSON.stringify(r, null, 1) + '</pre>'; console.log('[bot]', r); }, 30); };
}
function teleText(S) {
  const T = teleSummary(S);
  let s = `time ${mmss(S.t)}${speed > 1 ? ' x' + speed : ''} | ${fps} fps | frame work ${frameMs.toFixed(2)} ms (JS + draw submit)\n` + (S.tele.cheats ? 'CHEATS USED: ' + S.tele.cheats.map(c => c.name + ' @' + mmss(c.t)).join(', ') + '\n' : '') + `first lit ${mmss(T.firstLit)} | first upgrade ${mmss(T.firstUpgrade)} (GB1 <= 1:00)\nkeeper#1 ${mmss(T.keeper1)} | tier3 ${mmss(T.tier3)} | tier4 ${mmss(T.tier4)} | tier5 ${mmss(T.tier5)}\nlaunch ${mmss(T.launchAt)} (GB3 22-32 min) | Lit>sell from min ${T.litBeatsSellMin ?? '–'} (GB2 4-7)\nuptime: 3+ keepers ${T.uptimeK3 ?? '–'}% | 0 keepers ${T.uptimeK0 ?? '–'}% | storms ${T.storms}\n\n min   lit$  sell$  up%  tiles moon\n`;
  for (const m of T.minutes.slice(-15)) s += `${String(m.m).padStart(4)} ${String(m.lit).padStart(6)} ${String(m.sell).padStart(6)} ${String(m.up ?? '–').padStart(4)} ${String(m.litTiles ?? '').padStart(6)} ${String(m.moon ?? '').padStart(5)}\n`;
  return s;
}
document.getElementById('btnPanel').onclick = () => { const on = panel.style.display !== 'block'; panel.style.display = on ? 'block' : 'none'; if (on) buildPanel(); };

// selfTest = shared sim test + 3D-only checks (pay zone, input rotation)
function selfTest3d() {
  const r = selfTest();
  const S = newGame(JSON.parse(JSON.stringify(CONFIG)), { headless: true }); S.payFlow = true; S.cash = 30; S.player.x = PADS[1].c + 1; S.player.y = PADS[1].r + 1;
  for (let i = 0; i < 40; i++) step(S, 0.05, null); const partial = S.gatePaid > 29 && !S.unlocked[1] && S.cash < 1e-6;
  S.cash += 100; for (let i = 0; i < 40; i++) step(S, 0.05, null);
  r.payZone = partial && S.unlocked[1] && Math.abs(S.cash - (130 - gateCost(S, 1))) < 1e-6 && S.gatePaid === 0;
  keys.w = true; const v = inputVec(); keys.w = false; const yaw = CAM.yawDeg * Math.PI / 180;
  // pay zones in this layer: tool tier bought after ui.payZoneSec on the rack; first Keeper free and instant at the Crew Bay
  const T = newGame(JSON.parse(JSON.stringify(CONFIG)), { headless: true }); T.zonePaid = {}; T.cash = T.cfg.tools[1].cost; T.player.x = ZONES.tool.c + 1; T.player.y = ZONES.tool.r + 1;
  for (let i = 0; i < 10; i++) stepPayZones(T, 0.05); const toolHalf = T.tool === 0 && T.zonePaid.tool > 0;
  for (let i = 0; i < 30; i++) stepPayZones(T, 0.05); r.toolPayZone = toolHalf && T.tool === 1 && Math.abs(T.cash) < 1e-6 && T.zonePaid.tool === 0;
  T.crewOpen = true; T.player.x = ZONES.crew.c + 1; T.player.y = ZONES.crew.r + 1; stepPayZones(T, 0.05); r.freeKeeper = T.keepers.length === 1;
  if (ASSETS) r.toolAssets = CONFIG.tools.every((t, k) => ASSETS.has('tool' + k) && (k < 4 || ASSETS.has('veh' + k)));
  r.padsOutsideDepot = Object.values(ZONES).every(z => z.c >= DEPOT.c + DEPOT.w || z.c + z.w <= DEPOT.c || z.r >= DEPOT.r + DEPOT.h || z.r + z.h <= DEPOT.r);
  r.inputMatchesCamera = Math.abs(v.x + Math.sin(yaw)) < 1e-9 && Math.abs(v.y + Math.cos(yaw)) < 1e-9; // "up" on screen = away from camera
  r.pass = Object.entries(r).every(([k, v]) => k === 'pass' || v === true);
  console.assert(r.pass, 'selfTest3d failed', r);
  return r;
}
function benchFrames(n = 120) {
  const gl = renderer.getContext(), ms = []; for (let i = 0; i < n; i++) { const t0 = performance.now(); step(G, 1 / 60, { x: Math.cos(i / 20), y: Math.sin(i / 20) }); updateWorld(G, 1 / 60); renderer.render(scene, camera); drawOverlay(G); gl.finish(); ms.push(performance.now() - t0); }
  ms.sort((a, b) => a - b); const avg = ms.reduce((a, b) => a + b, 0) / n;
  return { frames: n, avgMs: +avg.toFixed(2), p50: +ms[n >> 1].toFixed(2), p95: +ms[Math.floor(n * 0.95)].toFixed(2), fpsIfBound: Math.round(1000 / avg), drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
}
const selfTestResult = selfTest3d();
console.log('[selfTest]', selfTestResult);
Object.defineProperty(SP, 'G', { get: () => G, set: v => { G = v; } }); Object.defineProperty(SP, 'frameMs', { get: () => frameMs }); Object.assign(SP, { GROUND, stepAlarm, LIT_LOOK, benchFrames, writeTiles, animatePlayer, maskStats, toggleCheat, CHEATS, cheat, updateWorld, drawOverlay, stepPayZones, moneyFlows, ZONES, selfTest3d, renderer, scene, camera, inputVec, CAM });

let last = performance.now(), teleTimer = 0, logMin = 0, fpsN = 0, fpsT = 0;
function frame(now) {
  const t0 = performance.now(), real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!G.popup) { let rem = real * speed; const inp = inputVec(); while (rem > 1e-6) { const d = Math.min(0.05, rem); step(G, d, inp); stepPayZones(G, d); rem -= d; } }
  moneyFlows(G, real);
  updateWorld(G, real); renderer.render(scene, camera); drawOverlay(G);
  frameMs += (performance.now() - t0 - frameMs) * 0.05;
  fpsN++; fpsT += real; if (fpsT >= 1) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  teleTimer += real; if (teleTimer > 0.5 && panel.style.display === 'block') { teleTimer = 0; const el = document.getElementById('tele'); if (el) el.textContent = teleText(G); }
  if (Math.floor(G.t / 60) > logMin) { logMin = Math.floor(G.t / 60); const m = G.tele.min[logMin - 1]; if (m) console.log('[tele]', JSON.stringify({ m: logMin, lit: Math.round(m.lit), sell: Math.round(m.sell), litTiles: G.litCount })); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
