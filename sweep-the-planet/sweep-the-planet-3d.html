    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

{ const g = new THREE.BufferGeometry(), p = []; for (let i = 0; i < 700; i++) { const v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8 - 0.1, Math.random() - 0.5).normalize().multiplyScalar(500); p.push(v.x + C / 2, v.y, v.z + R / 2); } g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9aa3ad, size: 1.6, sizeAttenuation: false }))); }

const RZ = ZONES.refinery, LZ = ZONES.launch;
const refinery = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 2.4, 8), lam(0x9aa3ad, { transparent: true, opacity: 0.55 })); refinery.position.set(RZ.c + RZ.w + 0.9, 1.2, RZ.r + 1); scene.add(refinery);

let rocketNose = rocket.children[2];
// floor pads: terminal + gate pay zone (+ fill bar) and floating labels
function labelSprite() {

for (const [id, z] of Object.entries(ZONES)) {
